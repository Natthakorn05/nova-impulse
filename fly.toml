# Fly.io config (§10). Static nginx container — no backend, no database.
# `fly launch` will offer to regenerate this; keeping it here means
# `fly deploy` works directly once you've set an app name.

app = "nova-impulse"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 80
  force_https = true
  # Scale to zero when idle — free tier friendly. First request after an
  # idle period pays a short cold start.
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
